# Snake Game Configuration

# Grid dimensions
grid.width=10
grid.height=10

# GUI settings
gui.enabled=false
game.speed=80

#DQN or QL
agent = QL

agent.dqn.replay=5000
agent.dqn.batch=16

agent.dqn.train.frequency=2
agent.dqn.parallel.games=0

agent.alpha=0.0001
agent.gamma=0.99999995

#override epsilon from file
agent.epsilon.override=true

agent.epsilon.start=1.0
agent.epsilon.min=0.05
agent.epsilon.decay = 0.999999995

dashboard.enabled=true
dashboard.bind=127.0.0.1
dashboard.port=8080
dashboard.refresh.ms=500
